version: '3.8'

services:
  # База данных
  db:
    image: postgres:15-alpine
    container_name: auth_postgres
    environment:
      POSTGRES_USER: webchat
      POSTGRES_PASSWORD: webchat
      POSTGRES_DB: webchat
    volumes:
      # Путь к твоему init.sql из иерархии
      - ./docker/psql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webchat -d webchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go сервис
  go-app:
    build:
      context: . # Контекст — корень webchat
      dockerfile: docker/go/Dockerfile
    container_name: auth_go_service
    env_file:
      - .env
    ports:
      - "50051:50051"
    environment:
      - DB_DSN=host=db user=webchat password=webchat dbname=webchat sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: